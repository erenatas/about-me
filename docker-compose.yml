services:
  nginx-proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    restart: unless-stopped
    ports:
      - '5480:80' # Public HTTP Port
      - '54443:443' # Public HTTPS Port
      - '5481:81' # Admin Web Port
    volumes:
      - ./compose/data:/data:Z
      - ./compose/letsencrypt:/etc/letsencrypt:Z
    networks:
      - npm-public
  app:
    image: 'erenatas/about-me:latest'
    build: .
    # ports:
    #   - 8080:8080
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/aboutme_db
    restart: unless-stopped
    depends_on:
      - postgres
    networks:
      - npm-public

  postgres:
    image: postgres:17
    ports:
      - 5432:5432
    volumes:
      - "postgres-data:/var/lib/postgresql/data"
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=aboutme_db
    networks:
      - npm-public

volumes:
  postgres-data:

networks:
  npm-public:
    driver: bridge
